<?xml version="1.0" encoding="UTF-8"?>
<!--
  Football — generic sport fallback

  Sport-ball fallback (watermarks.ts), shown when a competition badge cannot be
  fetched.

  LINE ART with alpha shading, not a solid silhouette. The `mono` treatment is
  brightness(0) invert(1): it flattens colour but leaves ALPHA untouched, so the
  tonal work here survives and one file reads white on a dark card and ink on a
  light one. Nothing depends on hue.

  viewBox is the artwork's tight bounding box, so padRight is 0%.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="360" height="360" role="img" aria-label="Football">
  <defs>
    <radialGradient id="sh" cx="34%" cy="26%" r="80%">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.30"/>
      <stop offset="58%"  stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0.04"/>
    </radialGradient>
  </defs>
  <g stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="180" cy="180" rx="170" ry="170" fill="url(#sh)" stroke="none"/>
    <ellipse cx="180" cy="180" rx="170" ry="170" fill="none" stroke="#fff" stroke-width="6.5" stroke-opacity="0.95"/>
    <path d="M180.0 234.0 L128.6 196.7 L148.3 136.3 L211.7 136.3 L231.4 196.7 Z" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-width="4.6" stroke-opacity="0.75"/>
