<!--
  Chequered flag — generic sport fallback

  Part of the sport-ball fallback set (see watermarks.ts). Detail is carried by
  TRANSPARENT holes, never a second fill: the `mono` treatment collapses every
  colour to one ink, so anything drawn in a lighter shade would vanish. The
  viewBox is the artwork's tight bounding box, so padRight is 0%.
-->
