<!--
  Cricket ball — generic sport fallback

  Sport-ball fallback (watermarks.ts), shown when a competition badge cannot be
  fetched.

  LINE ART with alpha shading, not a solid silhouette. The `mono` treatment is
  brightness(0) invert(1): it flattens colour but leaves ALPHA untouched, so the
  tonal work here survives and one file reads white on a dark card and ink on a
  light one. Nothing depends on hue.

  viewBox is the artwork's tight bounding box, so padRight is 0%.
-->
